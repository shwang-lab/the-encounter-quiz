<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Encounter — Listening Quiz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <!-- ============ SCREEN 1: LOGIN ============ -->
  <section id="screen-login" class="screen">
    <p class="kicker">English Through Films</p>
    <h1>The Encounter</h1>
    <p class="subtitle">Listening Comprehension Quiz · 25 Questions</p>

    <div class="card">
      <label for="student-select">이름을 선택하세요</label>
      <select id="student-select">
        <option value="" disabled selected>학생 명단에서 선택...</option>
      </select>

      <label for="class-code" class="mt">오늘의 클래스 코드</label>
      <input type="text" id="class-code" placeholder="선생님이 알려준 코드를 입력하세요" autocomplete="off">

      <p id="login-error" class="error-msg" hidden></p>

      <button id="btn-login" class="btn btn-primary mt">시험 입장</button>
    </div>
  </section>

  <!-- ============ SCREEN 2: QUIZ ============ -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="quiz-header">
      <div>
        <p class="kicker">The Encounter · Listening Quiz</p>
        <h2 id="student-name-display"></h2>
      </div>
      <div class="progress-wrap">
        <span id="progress-text">0 / 25 답변</span>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
    </div>

    <p class="instructions">
      각 오디오는 최대 <strong>2번</strong>까지 재생할 수 있습니다. 잘 듣고 가장 알맞은 답을 고르세요.
    </p>

    <div id="quiz-blocks"></div>

    <div class="submit-zone">
      <button id="btn-pdf" class="btn btn-secondary">내 답안 PDF로 저장</button>
      <button id="btn-submit" class="btn btn-primary">제출하기</button>
      <p id="submit-warning" class="error-msg" hidden></p>
    </div>
  </section>

  <!-- ============ SCREEN 3: DONE ============ -->
  <section id="screen-done" class="screen" hidden>
    <div class="card center">
      <p class="kicker">제출 완료</p>
      <h1 id="score-display"></h1>
      <p id="done-name" class="subtitle"></p>
      <p class="done-note">수고하셨습니다! 결과가 자동으로 저장되었습니다.</p>
    </div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/students.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
