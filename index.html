<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Encounter — Listening Quiz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <!-- ============ SCREEN 1: LOGIN ============ -->
  <section id="screen-login" class="screen">
    <p class="kicker">English Through Films</p>
    <h1>The Encounter</h1>
    <p class="subtitle">Listening Comprehension Quiz · 25 Questions</p>

    <div class="card">
      <label for="student-name-input">Enter your name</label>
      <input type="text" id="student-name-input" placeholder="Type your full name" autocomplete="off">

      <label for="class-code" class="mt">Password</label>
      <input type="text" id="class-code" placeholder="Enter the password your teacher gave you" autocomplete="off">

      <p id="login-error" class="error-msg" hidden></p>

      <button id="btn-login" class="btn btn-primary mt">Start Quiz</button>
    </div>
  </section>

  <!-- ============ SCREEN 2: QUIZ ============ -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="quiz-header">
      <div>
        <p class="kicker">The Encounter · Listening Quiz</p>
        <h2 id="student-name-display"></h2>
      </div>
      <div class="progress-wrap">
        <span id="progress-text">0 / 25 answered</span>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
    </div>

    <p class="instructions">
      Each audio clip can be played up to <strong>2 times</strong>. Listen carefully and choose the best answer.
    </p>

    <div id="quiz-blocks"></div>

    <div class="submit-zone">
      <button id="btn-pdf" class="btn btn-secondary">Save My Answers as PDF</button>
      <button id="btn-submit" class="btn btn-primary">Submit</button>
      <p id="submit-warning" class="error-msg" hidden></p>
    </div>
  </section>

  <!-- ============ SCREEN 3: DONE ============ -->
  <section id="screen-done" class="screen" hidden>
    <div class="card center">
      <p class="kicker">Submitted</p>
      <h1 id="score-display"></h1>
      <p id="done-name" class="subtitle"></p>
      <p class="done-note">Great work! Your result has been saved automatically.</p>
    </div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/config.js?v=3"></script>
<script src="js/quiz-data.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
