<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructor — The Encounter Quiz</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/instructor.css">
</head>
<body>

<div class="wrap wrap-wide">

  <!-- ============ GATE ============ -->
  <section id="screen-gate" class="screen">
    <p class="kicker">Instructor Only</p>
    <h1>Instructor Login</h1>
    <p class="subtitle">The Encounter — Listening Quiz</p>

    <div class="card">
      <label for="pw-input">Password</label>
      <input type="password" id="pw-input" autocomplete="off">
      <p id="gate-error" class="error-msg" hidden></p>
      <button id="btn-unlock" class="btn btn-primary mt">Enter</button>
    </div>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section id="screen-dashboard" class="screen" hidden>
    <p class="kicker">Instructor Dashboard</p>
    <h1>The Encounter — Grading Dashboard</h1>

    <div class="card code-card">
      <label for="code-input">Today's class code</label>
      <div class="code-row">
        <input type="text" id="code-input" placeholder="e.g. 0915">
        <button id="btn-set-code" class="btn btn-secondary">Set Code</button>
      </div>
      <p id="code-status" class="hint"></p>
    </div>

    <div class="stats-row">
      <div class="stat"><span id="stat-count">0</span><label>Submitted</label></div>
      <div class="stat"><span id="stat-avg">–</span><label>Average Score</label></div>
    </div>

    <div class="table-toolbar">
      <button id="btn-refresh" class="btn btn-secondary">Refresh</button>
      <button id="btn-export-csv" class="btn btn-secondary">Download CSV</button>
    </div>

    <div id="table-wrap"></div>
  </section>

</div>

<script src="js/config.js?v=3"></script>
<script src="js/quiz-data.js?v=3"></script>
<script src="js/instructor.js?v=3"></script>
</body>
</html>
